<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Magnetic Load Floor Installation Guide</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: white;
    }

    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;

      text-align: center;
      padding: 8px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));

      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      font-family: Arial, sans-serif;
      font-size: 14px;

      border-top: 1px solid rgba(0,0,0,0.12);
      white-space: nowrap;
    }

    .controls button {
      background: none;
      border: none;
      font-size: 14px;
      padding: 6px 12px;
      cursor: pointer;
    }

    .controls button.active {
      font-weight: bold;
      text-decoration: underline;
    }

    .page {
      padding-bottom: 50px;
    }

    #guideWrap {
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
    }

    #guide {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      max-width: none;
    }
  </style>
</head>

<body>

  <div class="page">
    <div id="guideWrap">
      <img
        id="guide"
        src="magclip.jpg"
        alt="Magnetic Load Floor Installation Guide"
      >
    </div>
  </div>

  <div class="controls">
    <button data-scale="0.75">75%</button>
    |
    <button data-scale="1" class="active">100%</button>
    |
    <button data-scale="1.25">125%</button>
  </div>

  <script>
    const guide = document.getElementById("guide");
    const guideWrap = document.getElementById("guideWrap");
    const buttons = document.querySelectorAll(".controls button");

    let baseScale = 1;
    let pinchScale = 1;

    let startDistance = 0;
    let startScale = 1;

    let pinchX = 0;
    let contentRatio = 0.5;

    function orientationFactor() {
      return window.innerWidth > window.innerHeight ? 0.5 : 1;
    }

    function updateGuide() {
      const factor = orientationFactor();
      const finalScale = baseScale * factor * pinchScale;
      const finalSize = finalScale * 100;

      guide.style.width = finalSize + "%";

      if (finalSize <= 100) {
        guide.style.marginLeft = "auto";
        guide.style.marginRight = "auto";
      } else {
        guide.style.marginLeft = "0";
        guide.style.marginRight = "0";
      }
    }

    function setView(scale) {
      baseScale = scale;
      pinchScale = 1;

      updateGuide();

      buttons.forEach(button => {
        button.classList.toggle(
          "active",
          Number(button.dataset.scale) === scale
        );
      });

      requestAnimationFrame(() => {
        if (guide.scrollWidth > guideWrap.clientWidth) {
          guideWrap.scrollLeft =
            (guide.scrollWidth - guideWrap.clientWidth) / 2;
        } else {
          guideWrap.scrollLeft = 0;
        }
      });
    }

    buttons.forEach(button => {
      button.addEventListener("click", function () {
        setView(Number(this.dataset.scale));
      });
    });

    function distance(touches) {
      const dx =
        touches[0].clientX - touches[1].clientX;

      const dy =
        touches[0].clientY - touches[1].clientY;

      return Math.sqrt(dx * dx + dy * dy);
    }

    function midpointX(touches) {
      return (
        touches[0].clientX +
        touches[1].clientX
      ) / 2;
    }

    guideWrap.addEventListener(
      "touchstart",
      function(e) {

        if (e.touches.length === 2) {
          e.preventDefault();

          startDistance = distance(e.touches);
          startScale = pinchScale;

          const rect =
            guideWrap.getBoundingClientRect();

          pinchX =
            midpointX(e.touches) - rect.left;

          const currentWidth =
            guide.getBoundingClientRect().width;

          contentRatio =
            (guideWrap.scrollLeft + pinchX) /
            currentWidth;

          contentRatio =
            Math.max(0, Math.min(1, contentRatio));
        }
      },
      { passive: false }
    );

    guideWrap.addEventListener(
      "touchmove",
      function(e) {

        if (e.touches.length === 2) {
          e.preventDefault();

          const currentDistance =
            distance(e.touches);

          const rawRatio =
            currentDistance / startDistance;

          // Softer / less touchy pinch zoom
          const softenedRatio =
            1 + ((rawRatio - 1) * 0.55);

          pinchScale =
            startScale * softenedRatio;

          pinchScale =
            Math.max(
              0.5,
              Math.min(pinchScale, 4)
            );

          updateGuide();

          requestAnimationFrame(() => {

            const newWidth =
              guide.getBoundingClientRect().width;

            const targetScroll =
              contentRatio * newWidth - pinchX;

            guideWrap.scrollLeft =
              Math.max(0, targetScroll);
          });
        }
      },
      { passive: false }
    );

    // Re-apply landscape 0.5 factor when phone rotates
    window.addEventListener("resize", function () {
      pinchScale = 1;
      updateGuide();

      requestAnimationFrame(() => {
        if (guide.scrollWidth > guideWrap.clientWidth) {
          guideWrap.scrollLeft =
            (guide.scrollWidth - guideWrap.clientWidth) / 2;
        } else {
          guideWrap.scrollLeft = 0;
        }
      });
    });

  </script>

</body>
</html>
