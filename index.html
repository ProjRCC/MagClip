<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    id="viewport"
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
  >

  <title>Magnetic Load Floor Installation Guide</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: white;
    }

    .controls {
      position: sticky;
      top: 0;
      z-index: 1000;
      text-align: center;
      padding: 8px;
      background: rgba(255,255,255,0.96);
      font-family: Arial, sans-serif;
      font-size: 14px;
      border-bottom: 1px solid #ddd;
      white-space: nowrap;
    }

    .controls button {
      background: none;
      border: none;
      font-size: 14px;
      padding: 6px 8px;
      cursor: pointer;
    }

    .controls button.active {
      font-weight: bold;
      text-decoration: underline;
    }

    #guide {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
    }
  </style>
</head>

<body>

  <div class="controls">
    View:
    <button data-size="50">50%</button>
    |
    <button data-size="75">75%</button>
    |
    <button data-size="100" class="active">100%</button>
    |
    <button data-size="125">125%</button>
  </div>

  <img
    id="guide"
    src="magclip.jpg"
    alt="Magnetic Load Floor Installation Guide"
  >

  <script>
    const viewport = document.getElementById("viewport");
    const guide = document.getElementById("guide");
    const buttons = document.querySelectorAll(".controls button");

    function resetAndSet(size) {

      // Force browser pinch zoom back to 1x
      viewport.setAttribute(
        "content",
        "width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
      );

      document.body.offsetHeight;

      // Apply selected guide size
      guide.style.width = size + "%";

      // Update active selection
      buttons.forEach(button => {
        button.classList.toggle(
          "active",
          Number(button.dataset.size) === size
        );
      });

      // Reset horizontal position
      window.scrollTo(0, window.scrollY);

      // Re-enable pinch zoom
      setTimeout(() => {
        viewport.setAttribute(
          "content",
          "width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes"
        );
      }, 300);
    }

    buttons.forEach(button => {
      button.addEventListener("click", function () {
        resetAndSet(Number(this.dataset.size));
      });
    });
  </script>

</body>
</html>
