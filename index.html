<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Magnetic Load Floor Installation Guide</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: white;
      overflow-x: auto;
    }

    .controls {
      position: sticky;
      top: 0;
      z-index: 1000;
      text-align: center;
      padding: 8px;
      background: rgba(255,255,255,0.96);
      font-family: Arial, sans-serif;
      font-size: 14px;
      border-bottom: 1px solid #ddd;
      white-space: nowrap;
    }

    .controls button {
      background: none;
      border: none;
      font-size: 14px;
      padding: 6px 7px;
      cursor: pointer;
    }

    .controls button.active {
      font-weight: bold;
      text-decoration: underline;
    }

    #guideWrap {
      width: 100%;
      overflow: visible;
    }

    #guide {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      transform-origin: top left;
      touch-action: pan-y;
    }
  </style>
</head>

<body>

  <div class="controls">
    View:
    <button data-size="50">50%</button>
    |
    <button data-size="75">75%</button>
    |
    <button data-size="100" class="active">100%</button>
    |
    <button data-size="125">125%</button>
  </div>

  <div id="guideWrap">
    <img
      id="guide"
      src="magclip.jpg"
      alt="Magnetic Load Floor Installation Guide"
    >
  </div>

  <script>
    const guide = document.getElementById("guide");
    const buttons = document.querySelectorAll(".controls button");

    let baseSize = 100;
    let pinchScale = 1;

    let startDistance = 0;
    let startScale = 1;

    function updateGuide() {
      const finalSize = baseSize * pinchScale;

      guide.style.width = finalSize + "%";

      if (finalSize <= 100) {
        guide.style.marginLeft = "auto";
        guide.style.marginRight = "auto";
      } else {
        guide.style.marginLeft = "0";
        guide.style.marginRight = "0";
      }
    }

    function setView(size) {
      baseSize = size;
      pinchScale = 1;

      updateGuide();

      buttons.forEach(button => {
        button.classList.toggle(
          "active",
          Number(button.dataset.size) === size
        );
      });

      window.scrollTo({
        left: 0,
        top: window.scrollY
      });
    }

    buttons.forEach(button => {
      button.addEventListener("click", function () {
        setView(Number(this.dataset.size));
      });
    });

    function getDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    guide.addEventListener("touchstart", function(e) {
      if (e.touches.length === 2) {
        e.preventDefault();

        startDistance = getDistance(e.touches);
        startScale = pinchScale;
      }
    }, { passive: false });

    guide.addEventListener("touchmove", function(e) {
      if (e.touches.length === 2) {
        e.preventDefault();

        const currentDistance = getDistance(e.touches);

        pinchScale =
          startScale * (currentDistance / startDistance);

        pinchScale = Math.max(0.5, Math.min(pinchScale, 4));

        updateGuide();
      }
    }, { passive: false });
  </script>

</body>
</html>
