<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Magnetic Load Floor Installation Guide</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: white;
    }

    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;

      text-align: right;
      padding: 8px;
      padding-right: 18px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));

      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      font-family: Arial, sans-serif;
      font-size: 14px;

      border-top: 1px solid rgba(0,0,0,0.12);
      white-space: nowrap;

      transition: opacity 0.35s ease;
    }

    .controls.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .controls button {
      background: none;
      border: none;
      font-size: 14px;
      padding: 6px 12px;
      cursor: pointer;
    }

    .controls button.active {
      font-weight: bold;
      text-decoration: underline;
    }

    .page {
      padding-bottom: 50px;
    }

    #guideWrap {
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
    }

    #guide {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      max-width: none;
    }
  </style>
</head>

<body>

  <div class="page">
    <div id="guideWrap">
      <img
        id="guide"
        src="magclip.jpg"
        alt="Magnetic Load Floor Installation Guide"
      >
    </div>
  </div>

  <div class="controls">
    <button data-scale="0.75">75%</button>
    |
    <button data-scale="1" class="active">100%</button>
    |
    <button data-scale="1.25">125%</button>
  </div>

  <script>
    const guide = document.getElementById("guide");
    const guideWrap = document.getElementById("guideWrap");
    const controls = document.querySelector(".controls");
    const buttons = document.querySelectorAll(".controls button");

    let baseScale = 1;
    let pinchScale = 1;

    let startDistance = 0;
    let startScale = 1;

    let anchorRatioX = 0.5;
    let anchorRatioY = 0.5;

    let anchorScreenX = 0;
    let anchorScreenY = 0;

    let hideTimer;
    let pinchFrame = null;

    let isLandscape =
      window.innerWidth > window.innerHeight;

    function orientationFactor() {
      return isLandscape ? 0.5 : 1;
    }

    function updateGuide() {
      const factor = orientationFactor();

      const finalScale =
        baseScale * factor * pinchScale;

      const finalSize =
        finalScale * 100;

      guide.style.width =
        finalSize + "%";

      if (finalSize <= 100) {
        guide.style.marginLeft = "auto";
        guide.style.marginRight = "auto";
      } else {
        guide.style.marginLeft = "0";
        guide.style.marginRight = "0";
      }
    }

    function setView(scale) {

      /*
        Preserve whatever part of the guide
        is currently at the top of the screen.
      */

      const oldRect =
        guide.getBoundingClientRect();

      let topRatio = 0;

      if (oldRect.height > 0) {
        topRatio =
          (0 - oldRect.top) /
          oldRect.height;

        topRatio =
          Math.max(
            0,
            Math.min(1, topRatio)
          );
      }

      baseScale = scale;
      pinchScale = 1;

      updateGuide();

      buttons.forEach(button => {
        button.classList.toggle(
          "active",
          Number(button.dataset.scale) === scale
        );
      });

      requestAnimationFrame(() => {

        const newRect =
          guide.getBoundingClientRect();

        const desiredTop =
          -(topRatio * newRect.height);

        const verticalDifference =
          newRect.top - desiredTop;

        window.scrollBy(
          0,
          verticalDifference
        );

        if (
          guide.scrollWidth >
          guideWrap.clientWidth
        ) {
          guideWrap.scrollLeft =
            (
              guide.scrollWidth -
              guideWrap.clientWidth
            ) / 2;
        } else {
          guideWrap.scrollLeft = 0;
        }
      });

      showControls();
    }

    buttons.forEach(button => {
      button.addEventListener(
        "click",
        function () {
          setView(
            Number(this.dataset.scale)
          );
        }
      );
    });

    function distance(touches) {
      const dx =
        touches[0].clientX -
        touches[1].clientX;

      const dy =
        touches[0].clientY -
        touches[1].clientY;

      return Math.sqrt(
        dx * dx + dy * dy
      );
    }

    function midpoint(touches) {
      return {
        x:
          (
            touches[0].clientX +
            touches[1].clientX
          ) / 2,

        y:
          (
            touches[0].clientY +
            touches[1].clientY
          ) / 2
      };
    }

    guideWrap.addEventListener(
      "touchstart",
      function(e) {

        showControls();

        if (e.touches.length === 2) {
          e.preventDefault();

          startDistance =
            distance(e.touches);

          startScale =
            pinchScale;

          const mid =
            midpoint(e.touches);

          anchorScreenX =
            mid.x;

          anchorScreenY =
            mid.y;

          const rect =
            guide.getBoundingClientRect();

          anchorRatioX =
            (
              anchorScreenX -
              rect.left
            ) / rect.width;

          anchorRatioY =
            (
              anchorScreenY -
              rect.top
            ) / rect.height;

          anchorRatioX =
            Math.max(
              0,
              Math.min(1, anchorRatioX)
            );

          anchorRatioY =
            Math.max(
              0,
              Math.min(1, anchorRatioY)
            );
        }
      },
      { passive: false }
    );

    guideWrap.addEventListener(
      "touchmove",
      function(e) {

        showControls();

        if (e.touches.length === 2) {
          e.preventDefault();

          const currentDistance =
            distance(e.touches);

          const rawRatio =
            currentDistance /
            startDistance;

          /*
            Softer pinch sensitivity.
          */
          const softenedRatio =
            1 +
            (
              (rawRatio - 1) *
              0.55
            );

          pinchScale =
            startScale *
            softenedRatio;

          pinchScale =
            Math.max(
              0.5,
              Math.min(
                pinchScale,
                4
              )
            );

          /*
            Update anchor to current finger
            position as fingers move.
          */

          const mid =
            midpoint(e.touches);

          anchorScreenX =
            mid.x;

          anchorScreenY =
            mid.y;

          updateGuide();

          if (pinchFrame) {
            cancelAnimationFrame(
              pinchFrame
            );
          }

          pinchFrame =
            requestAnimationFrame(() => {

              const newRect =
                guide.getBoundingClientRect();

              /*
                Find where the anchored point
                ended up after resizing.
              */

              const actualX =
                newRect.left +
                (
                  anchorRatioX *
                  newRect.width
                );

              const actualY =
                newRect.top +
                (
                  anchorRatioY *
                  newRect.height
                );

              /*
                Move horizontally so the same
                point remains under the fingers.
              */

              const deltaX =
                actualX -
                anchorScreenX;

              guideWrap.scrollLeft +=
                deltaX;

              /*
                Move vertically so the same
                point remains under the fingers.
              */

              const deltaY =
                actualY -
                anchorScreenY;

              window.scrollBy(
                0,
                deltaY
              );

              pinchFrame = null;
            });
        }
      },
      { passive: false }
    );

    function showControls() {
      controls.classList.remove(
        "hidden"
      );

      clearTimeout(hideTimer);

      hideTimer =
        setTimeout(() => {
          controls.classList.add(
            "hidden"
          );
        }, 2000);
    }

    document.addEventListener(
      "touchstart",
      showControls,
      { passive: true }
    );

    document.addEventListener(
      "touchmove",
      showControls,
      { passive: true }
    );

    document.addEventListener(
      "click",
      showControls
    );

    /*
      IMPORTANT:
      Mobile browsers fire resize events
      when their address/navigation bars
      appear or disappear.

      Only change scale if the actual
      orientation changed.
    */

    window.addEventListener(
      "resize",
      function () {

        const newLandscape =
          window.innerWidth >
          window.innerHeight;

        if (
          newLandscape ===
          isLandscape
        ) {
          return;
        }

        isLandscape =
          newLandscape;

        pinchScale = 1;

        updateGuide();

        requestAnimationFrame(() => {
          if (
            guide.scrollWidth >
            guideWrap.clientWidth
          ) {
            guideWrap.scrollLeft =
              (
                guide.scrollWidth -
                guideWrap.clientWidth
              ) / 2;
          } else {
            guideWrap.scrollLeft = 0;
          }
        });

        showControls();
      }
    );

    updateGuide();
    showControls();

  </script>

</body>
</html>
